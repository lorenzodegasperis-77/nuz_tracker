      <button class="btn btn-o" data-a="close-modal">Annulla</button>
      <button class="btn btn-r" data-a="save-game">${I.check} Salva Gioco</button>
    </div>
  </div>`;
}

function renderTeamViewer(){
  const r=run();const g=game();if(!r||!g)return'';
  const gymCard=(gym,i,isE4)=>{
    const rg=isE4?(r.e4teams||[])[i]||{team:[]}:(r.gyms||[])[i]||{team:[]};
    const team=rg.team||[];
    if(!team.length)return'';
    const name=isE4?gym.name:gym.leader;
    const c=TC[gym.type||'Normal']||'#888';
    return`<div class="tv-card">
      <div class="tv-header">
        <div class="tv-badge" style="background:${c}22;border:1.5px solid ${c}66">${I.badge}</div>
        <div>
          <div class="tv-name">${name}</div>
          <div class="tv-sub">${isE4?'Elite Four / Campione':gym.city} ${gym.type&&gym.type!=='Mixed'?'· '+gym.type:''}</div>
        </div>
      </div>
      <div class="tv-team">${team.map(s=>`<div class="tv-poke">
        ${s.sprite?`<img src="${s.sprite}">`:`<div style="width:42px;height:42px;background:var(--bd);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:18px">?</div>`}
        <div class="tv-poke-n">${s.displayName||''}</div>
        ${s.level?`<div class="tv-poke-l">Lv.${s.level}</div>`:''}
        ${(s.moves||[]).filter(Boolean).length?`<div style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px">${(s.moves||[]).filter(Boolean).map(m=>`<span class="pmv">${m}</span>`).join('')}</div>`:''}
      </div>`).join('')}</div>
    </div>`;
  };
  const gymCards=g.gyms.map((gym,i)=>gymCard(gym,i,false)).filter(Boolean).join('');
  const e4Cards=g.e4.map((e4,i)=>gymCard(e4,i,true)).filter(Boolean).join('');
  return`<div class="mb wide" style="max-width:760px">
  <button class="m-close" data-a="close-modal">${I.x}</button>
  <div class="m-ttl">${I.pokeball} Team Boss — ${r.name}</div>
  ${gymCards?`<div class="tv-section"><div class="tv-title">Palestre</div>${gymCards}</div>`:''}
  ${e4Cards?`<div class="tv-section"><div class="tv-title">Elite Four & Campione</div>${e4Cards}</div>`:''}
  ${!gymCards&&!e4Cards?`<p class="tv-empty" style="padding:20px 0">Nessun team ancora impostato.</p>`:''}
  <div class="m-act"><button class="btn btn-o" data-a="close-modal">Chiudi</button></div>
</div>`;
}

function renderBossTeamView(){
  const r=run();const g=game();if(!r||!g)return'';
  const ms=S.ms;
  const isE4=ms.isE4;
  const gi=ms.gymIdx;
  const gymDef=isE4?g.e4[gi]:g.gyms[gi];
  const rg=isE4?(r.e4teams||[])[gi]||{team:[]}:(r.gyms||[])[gi]||{team:[]};
  const team=rg.team||[];
  const name=isE4?gymDef?.name:gymDef?.leader;
  const city=isE4?'Elite Four / Campione':gymDef?.city;
  const type=gymDef?.type||'';
  const c=TC[type]||'#888';

  return`<div class="mb wide" style="max-width:700px">
  <button class="m-close" data-a="close-modal">${I.x}</button>
  <div class="btv-header">
    <div class="btv-badge-circle" style="background:${c}22;border:2px solid ${c}66">${I.pokeball}</div>
    <div>
      <div class="btv-leader-name">${name||'Allenatore'}</div>
      <div class="btv-leader-sub">${city}${type&&type!=='Mixed'?' · '+type:''}</div>
    </div>
    ${type&&type!=='Mixed'?`<div style="margin-left:auto">${tb(type,true)}</div>`:''}
  </div>
  ${!team.length?`<p class="def-none" style="padding:20px 0">Nessun team impostato.</p>`:`<div class="btv-grid">
    ${team.map(s=>{
      const pt=s.types||[];
      return`<div class="btv-poke">
        ${s.thumbnail?`<img class="btv-thumb" src="${s.thumbnail}" alt="${s.displayName}">`:`<div class="btv-thumb-ph">?</div>`}
        <div class="btv-pname">${s.displayName||s.species||'?'}</div>
        ${s.level?`<div class="btv-lv">Lv.${s.level}</div>`:''}
        ${pt.length?`<div class="btv-types">${pt.map(t=>tb(t,true)).join('')}</div>`:''}
        ${(s.moves||[]).filter(Boolean).length?`<div class="btv-moves">${(s.moves||[]).filter(Boolean).map(m=>`<div class="btv-mv">${m}</div>`).join('')}</div>`:''}
      </div>`;
    }).join('')}
  </div>`}
  <div class="m-act"><button class="btn btn-o" data-a="close-modal">Chiudi</button>
    <button class="btn btn-g btn-sm" data-a="edit-gym" data-gi="${gi}" data-e4="${isE4?1:0}" style="margin-left:auto">${I.edit} Modifica team</button>
  </div>
</div>`;
}

/* ══════════════ EVENTS ══════════════ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;

  if(a==='new-run'){S.modal={type:'new-run'};S.ms={};render();setTimeout(()=>document.getElementById('nr-name')?.focus(),50);}
  else if(a==='open-run'){S.runId=el.dataset.rid;S.view='tracker';S.tab='routes';render();}
  else if(a==='del-run'){e.stopPropagation();const rid=el.dataset.rid;const r=S.runs.find(x=>x.id===rid);if(r&&confirm(`Eliminare "${r.name}"?`)){S.runs=S.runs.filter(x=>x.id!==rid);sv();render();}}
  else if(a==='create-run'){
    const name=document.getElementById('nr-name')?.value.trim();
    const gameKey=document.getElementById('nr-game')?.value;
    if(!name){alert('Inserisci un nome.');return;}
    if(!gameKey){alert('Seleziona un gioco.');return;}
    const nr=newRun(name,gameKey);S.runs.push(nr);sv();
    S.runId=nr.id;S.view='tracker';S.tab='routes';S.modal=null;S.ms={};render();
  }
  else if(a==='go-home'){S.view='home';S.runId=null;S.modal=null;S.ms={};render();}
  else if(a==='set-tab'){S.tab=el.dataset.tab;render();}
  else if(a==='set-stab'){S.stab=el.dataset.stab;render();}
  else if(a==='close-modal'){S.modal=null;S.ms={};render();}
  else if(a==='close-modal-bg'){if(e.target===el){S.modal=null;S.ms={};render();}}
  else if(a==='reset-run'){
    const r=run();if(!r)return;
    if(!confirm('Resettare la run?\nVengono cancellati: squadra, box, cimitero, badge e incontri.\nI team delle palestre vengono conservati.'))return;
    r.pokemon=[];r.encounters={};
    r.gyms=(r.gyms||[]).map(g=>({...g,earned:false}));
    sv();render();
  }
  else if(a==='toggle-dark'){
    document.body.classList.toggle('dark');
    localStorage.setItem('nz_dark',document.body.classList.contains('dark')?'1':'0');
    render();
  }
  else if(a==='open-db-setup'){S.view='setup';S.setupStatus={pokedex:!!S.pokedexDB.length,types:!!S.typesDB.length,moves:!!Object.keys(S.movesDB).length};render();}
  else if(a==='finish-setup'){S.view='home';render();}
  else if(a==='reset-db'){clearDBs();render();}
  else if(a==='trigger-upload'){document.getElementById('up-'+el.dataset.type).click();}

  /* GAME MANAGER & EDITOR */
  else if(a==='open-game-manager'){S.modal={type:'game-manager'};render();}
  else if(a==='new-game'){
    S.modal={type:'game-editor'};
    S.ms={editKey:null,name:'',gen:4,areas:[],gyms:[],e4:[],geTab:'info'};
    render();
  }
  else if(a==='edit-game'){
    const key=el.dataset.key;
    const g=getGames()[key];
    S.modal={type:'game-editor'};
    S.ms={editKey:key,name:g.name,gen:g.gen,areas:[...g.areas],gyms:JSON.parse(JSON.stringify(g.gyms)),e4:JSON.parse(JSON.stringify(g.e4)),geTab:'info'};
    render();
  }
  else if(a==='del-game'){
    const key=el.dataset.key;
    if(confirm(`Eliminare il gioco personalizzato "${CUSTOM_GAMES[key]?.name}"?`)){
      delete CUSTOM_GAMES[key];saveCustomGames();render();
    }
  }
  else if(a==='ge-tab'){S.ms.geTab=el.dataset.t;render();}
  else if(a==='ge-area-add'){S.ms.areas.push('Nuova Area');render();}
  else if(a==='ge-area-del'){S.ms.areas.splice(parseInt(el.dataset.idx),1);render();}
  else if(a==='ge-area-up'){
    const i=parseInt(el.dataset.idx);if(i>0){[S.ms.areas[i],S.ms.areas[i-1]]=[S.ms.areas[i-1],S.ms.areas[i]];render();}
  }
  else if(a==='ge-area-down'){
    const i=parseInt(el.dataset.idx);if(i<S.ms.areas.length-1){[S.ms.areas[i],S.ms.areas[i+1]]=[S.ms.areas[i+1],S.ms.areas[i]];render();}
  }
  else if(a==='ge-gym-add'){S.ms.gyms.push({leader:'',city:'',type:'',badge:'',levelCap:0});render();}
  else if(a==='ge-gym-del'){S.ms.gyms.splice(parseInt(el.dataset.i),1);render();}
  else if(a==='ge-e4-add'){S.ms.e4.push({name:'',type:''});render();}
  else if(a==='ge-e4-del'){S.ms.e4.splice(parseInt(el.dataset.i),1);render();}
  else if(a==='save-game'){
    const name=document.getElementById('ge-name')?.value.trim();
    const gen=parseInt(document.getElementById('ge-gen')?.value)||4;
    if(!name){alert('Inserisci un nome.');return;}
    const areas=Array.from(document.querySelectorAll('[data-a="ge-area-input"]')).map(i=>i.value.trim()).filter(Boolean);
    const gyms=[];document.querySelectorAll('.ge-gym-leader').forEach((el,i)=>{
      const row=el.closest('div');
      gyms.push({leader:el.value.trim(),city:row.querySelector('.ge-gym-city').value.trim(),type:row.querySelector('.ge-gym-type').value.trim(),badge:row.querySelector('.ge-gym-badge').value.trim(),levelCap:parseInt(row.querySelector('.ge-gym-cap').value)||0});
    });
    const e4=[];document.querySelectorAll('.ge-e4-name').forEach((el,i)=>{
      const row=el.closest('div');
      e4.push({name:el.value.trim(),type:row.querySelector('.ge-e4-type').value.trim()});
    });
    const key=S.ms.editKey||'custom-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    CUSTOM_GAMES[key]={name,gen,areas,gyms,e4};
    saveCustomGames();
    S.modal=null;S.ms={};render();
  }

  /* POKEMON */
  else if(a==='add-poke'){
    const st=el.dataset.st||'party';
    S.modal={type:'add-poke'};S.ms={status:st,moves:['','','',''],sugg:[],speciesQ:'',selectedPoke:null,area:''};
    render();setTimeout(()=>document.getElementById('poke-search')?.focus(),50);
  }
  else if(a==='add-enc-poke'){
    const area=du(el.dataset.area);
    S.modal={type:'add-poke'};S.ms={status:'box',moves:['','','',''],sugg:[],speciesQ:'',selectedPoke:null,area,fromEncounter:true};
    render();setTimeout(()=>document.getElementById('poke-search')?.focus(),50);
  }
  else if(a==='edit-poke'){
    const pid=el.dataset.pid;const r=run();const p=r.pokemon.find(x=>x.id===pid);if(!p)return;
    const fresh=pokeFromName(p.speciesName);
    const sp=fresh?buildSP(fresh):{displayName:p.speciesName,types:p.types,abilities:[p.ability].filter(Boolean),sprite:p.sprite,thumbnail:p.thumbnail||p.sprite,name:p.species,stats:null,dexId:null,description:''};
    S.modal={type:'edit-poke'};
    S.ms={pokeId:pid,speciesQ:p.speciesName,selectedPoke:sp,nickname:p.nickname,level:p.level,nature:p.nature,ability:p.ability,moves:[...(p.moves||['','','',''])],area:p.area,status:p.status,deathArea:p.deathArea||'',sugg:[]};
    render();
  }
  else if(a==='sel-species'){
    const poke=pokeFromName(el.dataset.name);
    if(poke){S.ms.selectedPoke=buildSP(poke);S.ms.speciesQ=poke.name.english;S.ms.ability=S.ms.selectedPoke.abilities[0]||'';}
    const sd=document.getElementById('poke-sugg');if(sd)sd.style.display='none';
    render();
  }
  else if(a==='add-poke-confirm'){commitPoke(false);}
  else if(a==='save-poke'){commitPoke(true);}
  else if(a==='del-poke'){
    if(!confirm('Eliminare questo Pokémon?'))return;
    const r=run();r.pokemon=r.pokemon.filter(p=>p.id!==el.dataset.pid);sv();S.modal=null;S.ms={};render();
  }
  else if(a==='poke-box'){const r=run();const p=r.pokemon.find(x=>x.id===el.dataset.pid);if(p){p.status='box';sv();render();}}
  else if(a==='poke-party'){
    const r=run();const p=r.pokemon.find(x=>x.id===el.dataset.pid);
    if((r.pokemon||[]).filter(x=>x.status==='party').length>=6){alert('Squadra al completo (6/6).');return;}
    if(p){p.status='party';sv();render();}
  }
  else if(a==='poke-ko'){
    const r=run();const p=r.pokemon.find(x=>x.id===el.dataset.pid);if(!p)return;
    S.modal={type:'confirm-ko'};S.ms={pokeId:el.dataset.pid,pokeName:p.nickname||p.speciesName};render();
  }
  else if(a==='confirm-ko'){
    const area=document.getElementById('ko-area')?.value||'';
    const r=run();const p=r.pokemon.find(x=>x.id===S.ms.pokeId);
    if(p){p.status='dead';p.deathArea=area;sv();}
    S.modal=null;S.ms={};render();
  }

  /* ENCOUNTERS */
  else if(a==='set-enc'){
    const area=du(el.dataset.area);const st=el.dataset.st;const r=run();
    if(!r.encounters[area])r.encounters[area]={};
    const prev=r.encounters[area].status;
    const newSt=prev===st?null:st;
    r.encounters[area].status=newSt;sv();
    const isPos=['caught','traded','gifted'].includes(newSt);
    if(isPos&&!r.encounters[area].pokeId){
      S.modal={type:'add-poke'};S.ms={status:'box',moves:['','','',''],sugg:[],speciesQ:'',selectedPoke:null,area,fromEncounter:true};
      render();setTimeout(()=>document.getElementById('poke-search')?.focus(),50);
    }else render();
  }

  /* BADGES */
  else if(a==='toggle-badge'){
    const gi=parseInt(el.dataset.gi);const r=run();
    if(r.gyms[gi]){r.gyms[gi].earned=!r.gyms[gi].earned;sv();render();}
  }

  /* VIEW TEAMS */
  else if(a==='view-teams'){S.modal={type:'team-viewer'};render();}
  else if(a==='view-boss-team'){
    const gi=parseInt(el.dataset.gi);const isE4=el.dataset.e4==='1';
    S.modal={type:'boss-team-view'};S.ms={gymIdx:gi,isE4};render();
  }

  /* EXPORT / IMPORT */
  else if(a==='export-run'){
    const r=run();if(!r)return;
    const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a2=document.createElement('a');
    a2.href=url;a2.download=`nuzlocke-${r.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`;
    document.body.appendChild(a2);a2.click();document.body.removeChild(a2);
    URL.revokeObjectURL(url);
  }
  else if(a==='import-run'){document.getElementById('up-import-run').click();}

  /* ROUTE FILTERS */
  else if(a==='rf-status'){S.rFilters.status=el.dataset.v;render();}
  else if(a==='rf-reset'){S.rFilters={status:'',type:''};render();}

  /* GYM TEAM */
  else if(a==='edit-gym'){
    const gi=parseInt(el.dataset.gi);const isE4=el.dataset.e4==='1';const r=run();
    /* FIX: usato gi invece di i */
    const existing=isE4?(r.e4teams||[])[gi]||{team:[]}:(r.gyms||[])[gi]||{earned:false,team:[]};
    const slots=Array.from({length:6},(_,i)=>{
      const s=(existing.team||[])[i];
      return s?{search:s.displayName||s.species||'',displayName:s.displayName,sprite:s.sprite,thumbnail:s.thumbnail||s.sprite,level:s.level||'',species:s.species,moves:s.moves||['','','',''],sugg:[]}:{search:'',displayName:'',sprite:null,thumbnail:null,level:'',species:'',moves:['','','',''],sugg:[]};
    });
    S.modal={type:'edit-gym'};S.ms={gymIdx:gi,isE4,slots};render();
  }
  else if(a==='gym-sel-species'){
    const si=parseInt(el.dataset.si);
    const poke=pokeFromName(el.dataset.name);
    if(poke){const sp=buildSP(poke);S.ms.slots[si]={...S.ms.slots[si],displayName:sp.displayName,sprite:sp.sprite,thumbnail:sp.thumbnail,species:sp.name,search:sp.displayName,sugg:[]};}
    const div=document.getElementById(`gss-${si}`);if(div)div.style.display='none';
    render();
  }
  else if(a==='gym-clear-slot'){const si=parseInt(el.dataset.si);S.ms.slots[si]={search:'',displayName:'',sprite:null,thumbnail:null,level:'',species:'',moves:['','','',''],sugg:[]};render();}
  else if(a==='save-gym-team'){
    S.ms.slots.forEach((slot,i)=>{
      const lv=document.querySelector(`[data-a="gym-slot-lv"][data-si="${i}"]`);
      if(lv)slot.level=lv.value;
      slot.moves=[0,1,2,3].map(mi=>{
        const inp=document.querySelector(`[data-a="gym-mv-search"][data-si="${i}"][data-mi="${mi}"]`);
        return inp?inp.value.trim():'';
      });
    });
    const team=S.ms.slots.filter(s=>s.species).map(s=>({displayName:s.displayName,species:s.species,sprite:s.sprite,thumbnail:s.thumbnail||s.sprite,level:s.level||'',moves:s.moves||['','','','']}));
    const r=run();
    if(S.ms.isE4){if(!r.e4teams)r.e4teams=game().e4.map(()=>({team:[]}));r.e4teams[S.ms.gymIdx].team=team;}
    else r.gyms[S.ms.gymIdx].team=team;
    sv();S.modal=null;S.ms={};render();
  }

  /* MOVE SELECTION */
  else if(a==='sel-move'){
    const mi=parseInt(el.dataset.mi);
    const inp=document.getElementById(`poke-mv${mi}`);
    if(inp)inp.value=el.dataset.name;
    const div=document.getElementById(`move-sugg-${mi}`);
    if(div)div.style.display='none';
  }
  else if(a==='sel-gym-move'){
    const si=parseInt(el.dataset.si), mi=parseInt(el.dataset.mi);
    const inp=document.querySelector(`[data-a="gym-mv-search"][data-si="${si}"][data-mi="${mi}"]`);
    if(inp)inp.value=el.dataset.name;
    const div=document.getElementById(`gym-move-sugg-${si}-${mi}`);
    if(div)div.style.display='none';
    if(!S.ms.slots[si].moves)S.ms.slots[si].moves=['','','',''];
    S.ms.slots[si].moves[mi]=el.dataset.name;
  }
});

document.addEventListener('input',e=>{
  const el=e.target;const a=el.dataset.a;
  if(a==='poke-search'){
    S.ms.speciesQ=el.value;
    clearTimeout(S.debounce);
    S.debounce=setTimeout(()=>{
      const res=searchPokemon(el.value);
      const div=document.getElementById('poke-sugg');
      if(div){
        if(res.length){div.style.display='block';div.innerHTML=suggHTML(res,'sel-species');}
        else{div.style.display=el.value.length>=2?'block':'none';div.innerHTML=S.pokedexDB.length?'<div class="sug" style="color:var(--t3);cursor:default;font-style:italic">Nessun risultato</div>':'<div class="sug" style="color:var(--t3);cursor:default;font-style:italic">Caricamento pokedex.json…</div>';}
      }
    },150);
  }
  else if(a==='gym-slot-search'){
    const si=parseInt(el.dataset.si);if(S.ms.slots)S.ms.slots[si].search=el.value;
    clearTimeout(S.debounce);
    S.debounce=setTimeout(()=>{
      const res=searchPokemon(el.value);
      const div=document.getElementById(`gss-${si}`);
      if(div){
        if(res.length){div.style.display='block';div.innerHTML=suggHTML(res,'gym-sel-species',`data-si="${si}"`);}
        else{div.style.display=el.value.length>=2?'block':'none';div.innerHTML='<div class="sug" style="color:var(--t3);cursor:default;font-style:italic">Nessun risultato</div>';}
      }
    },150);
  }
  else if(a==='move-search'){
    const mi=parseInt(el.dataset.mi);
    clearTimeout(S.debounce);
    S.debounce=setTimeout(()=>{
      const res=searchMoves(el.value);
      const div=document.getElementById(`move-sugg-${mi}`);
      if(div){
        if(res.length){div.style.display='block';div.innerHTML=moveSuggHTML(res,mi);}
        else{div.style.display=el.value.length>=2?'block':'none';div.innerHTML='<div class="sug" style="color:var(--t3);cursor:default;font-style:italic">Nessun risultato</div>';}
      }
    },150);
  }
  else if(a==='gym-mv-search'){
    const si=parseInt(el.dataset.si), mi=parseInt(el.dataset.mi);
    clearTimeout(S.debounce);
    S.debounce=setTimeout(()=>{
      const res=searchMoves(el.value);
      const div=document.getElementById(`gym-move-sugg-${si}-${mi}`);
      if(div){
        if(res.length){div.style.display='block';div.innerHTML=moveSuggHTML(res,null,si,mi);}
        else{div.style.display=el.value.length>=2?'block':'none';div.innerHTML='<div class="sug" style="color:var(--t3);cursor:default;font-style:italic">Nessun risultato</div>';}
      }
    },150);
  }
  else if(a==='rf-type'){S.rFilters.type=el.value;render();}
});

/* File upload listeners */
['pokedex','types','moves'].forEach(type=>{
  const input=document.getElementById('up-'+type);
  if(!input)return;
  input.addEventListener('change',e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const data=JSON.parse(evt.target.result);
        if(type==='pokedex'){S.pokedexDB=data;saveDB('pokedex',data)}
        else if(type==='types'){S.typesDB=data;rebuildTypeChart();saveDB('types',data)}
        else if(type==='moves'){parseMovesDB(data);saveDB('moves',data)}
        S.setupStatus=S.setupStatus||{};
        S.setupStatus[type]=true;
        if(S.view==='setup')render();
      }catch(err){alert('JSON non valido: '+type)}
    };
    reader.readAsText(file);
    e.target.value='';
  });
});

/* Import Run listener */
const importInput=document.getElementById('up-import-run');
if(importInput){
  importInput.addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const data=JSON.parse(evt.target.result);
        if(!data.id||!data.name||!data.game){alert('File non valido: non è un salvataggio Nuzlocke.Log');return;}
        const existing=S.runs.find(r=>r.id===data.id);
        if(existing){
          if(!confirm(`Esiste già una run "${existing.name}". Sovrascrivere?`))return;
          S.runs=S.runs.filter(r=>r.id!==data.id);
        }
        S.runs.push(data);sv();render();
        alert(`Run "${data.name}" importata con successo!`);
      }catch(err){alert('Errore nel file di import: JSON non valido');}
    };
    reader.readAsText(file);
    e.target.value='';
  });
}

function commitPoke(isEdit){
  let sp=S.ms.selectedPoke;
  if(!sp){alert('Seleziona un Pokémon valido dalla lista.');return false;}
  const lvStr=(document.getElementById('poke-lv')?.value||'').trim();
  const lv=lvStr?parseInt(lvStr):1;
  if(lvStr&&(isNaN(lv)||lv<1||lv>100)){alert('Livello non valido (1–100).');return false;}
  const nick=document.getElementById('poke-nick')?.value.trim()||'';
  const area=document.getElementById('poke-area')?.value||'';
  const status=document.getElementById('poke-status')?.value||'party';
  const nature=document.getElementById('poke-nature')?.value||'';
  const ability=document.getElementById('poke-ability')?.value||'';
  const deathArea=document.getElementById('poke-death')?.value||'';
  const moves=[0,1,2,3].map(i=>document.getElementById(`poke-mv${i}`)?.value.trim()||'');
  const r=run();if(!r)return false;

  if(isEdit){
    const p=r.pokemon.find(x=>x.id===S.ms.pokeId);if(!p)return false;
    Object.assign(p,{species:sp.name,speciesName:sp.displayName,types:sp.types,sprite:sp.sprite,thumbnail:sp.thumbnail||sp.sprite,stats:sp.stats||p.stats||null,dexId:sp.dexId||p.dexId||null,nickname:nick,level:lv,area,status,nature,ability,moves,deathArea});
  }else{
    if(r.pokemon.map(p=>p.species).includes(sp.name)){if(!confirm(`Hai già ${sp.displayName} nella run. Dupes Clause. Procedere?`))return false;}
    const finalArea=area||S.ms.area||'';
    const p=newPoke({species:sp.name,speciesName:sp.displayName,nickname:nick,level:lv,nature,ability,moves,types:sp.types,sprite:sp.sprite,thumbnail:sp.thumbnail||sp.sprite,stats:sp.stats||null,dexId:sp.dexId||null,area:finalArea,status});
    r.pokemon.push(p);
    if(S.ms.fromEncounter&&S.ms.area){
      if(!r.encounters[S.ms.area])r.encounters[S.ms.area]={};
      r.encounters[S.ms.area].pokeId=p.id;
    }
    // Se NON è da un incontro, chiedi se aggiungere in squadra
    if(!S.ms.fromEncounter&&status==='box'&&r.pokemon.filter(x=>x.status==='party').length<6){
      if(confirm(`${p.nickname||p.speciesName} aggiunto al Box. Aggiungi anche in squadra?`))p.status='party';
    }
  }
  sv();S.modal=null;S.ms={};render();return true;
}

/* ══════════════ INIT ══════════════ */
lv();
loadCustomGames();
if(localStorage.getItem('nz_dark')==='1')document.body.classList.add('dark');
checkSetup();
render();
</script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f7;--card:#fff;--red:#FF0000;--red2:#FF0000;--blue:#3b7dca;--green:#16a34a;--amber:#d97706;--text:#1c1c1e;--t2:#6b6b75;--t3:#aeaeb2;--bd:#e5e5ea;--bd2:#d1d5db;--sh:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.04);--sh2:0 4px 16px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.06);--r1:8px;--r2:12px;--r3:16px;--hf:'Nunito',sans-serif;--mf:'Share Tech Mono',monospace;}
.dark{--bg:#0f0f12;--card:#1c1c1e;--text:#f2f2f7;--t2:#a1a1aa;--t3:#71717a;--bd:#2c2c2e;--bd2:#3a3a3c;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--hf);font-size:15px;line-height:1.5;min-height:100vh;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.tb{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.05em;line-height:1.7;white-space:nowrap}
button{cursor:pointer;border:none;font-family:var(--hf);font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn{padding:9px 18px;border-radius:var(--r1);font-size:14px}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:var(--red2)}
.btn-o{background:transparent;color:var(--text);border:1.5px solid var(--bd2)}.btn-o:hover{border-color:var(--t2);background:var(--bg)}
.btn-g{background:transparent;color:var(--t2);padding:5px 11px;font-size:12px;border-radius:var(--r1)}.btn-g:hover{background:var(--bg);color:var(--text)}
.btn-d{color:var(--red);border:none}.btn-d:hover{background:#ffddd5}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-i{background:#f2f2f7;color:#FF0000;width:30px;height:30px;justify-content:center;border-radius:50%}.btn-i:hover{background:var(--bg);color:var(--text)}
input,select{background:var(--bg);border:1.5px solid var(--bd);color:var(--text);font-family:var(--hf);font-size:14px;font-weight:600;padding:8px 12px;border-radius:var(--r1);width:100%;outline:none;transition:all .15s}
input:focus,select:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(227,53,13,.1)}
.dark input:focus,.dark select:focus{background:#2c2c2e}
select option{background:#fff;font-weight:500}
.dark select option{background:#1c1c1e}
input::placeholder{color:var(--t3);font-weight:500}
label{font-size:11px;color:var(--t2);margin-bottom:4px;display:block;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.fg{margin-bottom:13px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* NAV */
.nav{background:var(--card);border-bottom:1px solid var(--bd);padding:0 12px 0 20px;display:flex;align-items:center;height:58px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-logo{font-size:1.05rem;font-weight:900;color:var(--red);letter-spacing:-.02em;margin-right:14px;white-space:nowrap}
.nav-logo em{color:var(--text);font-style:normal}
.nav-tab{height:58px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:var(--t2);background:transparent;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;letter-spacing:.02em}
.nav-tab:hover{color:#f2f2f7;background:#fafafa}
.dark .nav-tab:hover{background:#2c2c2e}
.nav-tab.on{color:var(--red);border-bottom-color:#f2f2f7}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.run-chip{font-size:11px;font-weight:800;color:var(--t2);font-family:var(--mf);background:var(--bg);padding:4px 10px;border-radius:20px;border:1.5px solid var(--bd)}

/* SUBTABS */
.stabs{display:flex;gap:4px;padding:14px 24px 0}
.stab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;color:var(--t2);background:transparent;border:none;cursor:pointer;transition:all .15s}
.stab:hover{color:var(--text);background:var(--card)}
.dark .stab:hover{background:#2c2c2e}
.stab.on{color:var(--red)}

/* CONTENT */
.content{padding:20px 24px;max-width:1240px;margin:0 auto;width:100%}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.sh-t{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.sh-c{font-size:11px;font-weight:800;color:var(--t3);background:var(--bd);padding:1px 8px;border-radius:10px;font-family:var(--mf)}
.dv{border:none;border-top:1.5px solid var(--bd);margin:20px 0}

/* HOME */
.home{min-height:100vh;padding:48px;display:flex;flex-direction:column}
.home-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:44px;flex-wrap:wrap;gap:12px}
.home-logo{font-size:2.4rem;color:#f2f2f7;font-weight:900;line-height:1.1; text-shadow:1px 1px var(--red), -1px -1px var(--red), 1px -1px var(--red), -1px 1px var(--red)}
.home-logo span{color:var(--red)}
.home-sub{font-size:13px;color:var(--t2);margin-top:4px}
.home-tools{display:flex;gap:8px;align-items:center;margin-top:8px}
.runs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(278px,1fr));gap:14px}
.rc{background:var(--card);border-radius:var(--r3);padding:20px;cursor:pointer;transition:all .2s;box-shadow:var(--sh);border:2px solid transparent;position:relative;overflow:hidden}
.rc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--red)}
.rc:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--red)}
.rc-name{font-weight:900;font-size:1.05rem;margin-bottom:2px;color:#1c1c1e}
.rc-game{font-size:11px;color:var(--t2);font-weight:700;margin-bottom:12px;font-family:var(--mf)}
.rc-stats{display:flex;gap:14px;font-size:11px;font-weight:800;flex-wrap:wrap}
.rc-stat{display:flex;align-items:center;gap:4px;color:var(--t2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-g{background:#16a34a}.dot-r{background:var(--red)}.dot-y{background:var(--amber)}
.empty{text-align:center;padding:80px 20px}
.empty h2{font-size:1.2rem;color:var(--t2);margin-bottom:6px}.empty p{color:var(--t3)}

/* POKEMON CARDS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:20px}
.pc{background:var(--card);border-radius:var(--r3);padding:15px 13px;box-shadow:var(--sh);transition:all .2s;border:2px solid transparent}
.pc:hover{box-shadow:var(--sh2);border-color:var(--bd2)}
.pc.dead{opacity:.5;filter:grayscale(.8)}
.psprite{width:80px;height:80px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto 6px}
.psprite-ph{width:80px;height:80px;background:var(--bg);border-radius:var(--r2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:var(--t3);font-size:28px}
.pname{font-weight:900;font-size:.9rem;text-align:center;margin-bottom:1px}
.pspec{font-size:10px;color:var(--t2);text-align:center;margin-bottom:6px}
.ptyp{display:flex;justify-content:center;gap:3px;margin-bottom:6px}
.prow{font-family:var(--mf);font-size:10px;color:var(--t2);text-align:center;margin-bottom:2px}
.pmovs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:5px 0}
.pmv{font-size:9px;padding:1px 5px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;color:var(--t2);font-weight:700}
.par{font-size:10px;color:var(--t3);text-align:center;margin-bottom:9px;display:flex;align-items:center;justify-content:center;gap:3px}
.pac{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}

/* GRAVEYARD */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}
.gc{background:#fff8f8;border:1.5px solid #fecaca;border-radius:var(--r3);padding:13px;text-align:center}
.dark .gc{background:#1c0f0f;border-color:#5c2a2a}
.gsprite{filter:grayscale(100%) brightness(.65);width:66px;height:66px;object-fit:contain;image-rendering:pixelated;display:block;margin:0 auto 6px}
.gname{font-weight:900;font-size:.82rem;color:#991b1b;margin-bottom:1px}
.dark .gname{color:#fca5a5}
.gspec{font-size:10px;color:#b45309;margin-bottom:4px}
.ginfo{font-size:10px;color:#b45309;font-family:var(--mf);display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:2px}

/* ROUTES */
.rl{display:flex;flex-direction:column;gap:5px}
.rrow{background:var(--card);border-radius:var(--r2);padding:9px 13px;box-shadow:var(--sh);display:flex;align-items:center;gap:9px;flex-wrap:wrap;transition:box-shadow .15s}
.rrow:hover{box-shadow:var(--sh2)}
.rname{font-weight:800;font-size:13px;min-width:130px;flex-shrink:0}
.rbtns{display:flex;gap:3px;flex-wrap:wrap}
.eb{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;border:1.5px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.02em;font-family:var(--hf)}
.ec{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}.ec.on{background:#16a34a;color:#fff;border-color:#15803d}
.ed{background:#fff1f2;color:#be123c;border-color:#fecdd3}.ed.on{background:#dc2626;color:#fff;border-color:#991b1b}
.et{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.et.on{background:#2563eb;color:#fff;border-color:#1d4ed8}
.eg{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}.eg.on{background:#7c3aed;color:#fff;border-color:#6d28d9}
.em{background:#fffbeb;color:#b45309;border-color:#fde68a}.em.on{background:#d97706;color:#fff;border-color:#b45309}
.rpoke{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.rpoke img{width:26px;height:26px;image-rendering:pixelated;object-fit:contain}
.rpoke.dead{opacity:.5;color:var(--t3)}

/* GYMS */
.gymgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}
.gymc{background:var(--card);border-radius:var(--r3);padding:15px;box-shadow:var(--sh);border-top:4px solid var(--bd)}
.gymc.earned{border-top-color:#16a34a}
.gym-ln{font-weight:900;font-size:.95rem}
.gym-ct{font-size:11px;color:var(--t2);margin-bottom:8px;font-weight:600}
.gym-info{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.gym-cap{font-family:var(--mf);font-size:11px;color:var(--t2)}.gym-cap.dyn{color:var(--amber);font-weight:700}
.badge-btn{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;background:var(--bg);color:var(--t2);border:1.5px solid var(--bd);cursor:pointer;transition:all .15s;font-family:var(--hf)}
.badge-btn.on{background:#f0fdf4;color:#15803d;border-color:#86efac}
.gym-team{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.gpoke{display:flex;flex-direction:column;align-items:center;gap:1px}
.gpoke img{width:42px;height:42px;image-rendering:pixelated;object-fit:contain}
.gpoke-n{font-size:8px;color:var(--t2);font-weight:800;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.gpoke-l{font-size:8px;color:var(--t3);font-family:var(--mf)}
.no-team{font-size:11px;color:var(--t3);padding:4px 0}

/* ANALYSIS */
.an-sec{margin-bottom:28px}
.an-ttl{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--bd);padding-bottom:8px}
.type-tbl{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.type-tbl th{font-family:var(--mf);font-size:9px;letter-spacing:.05em;color:var(--t3);text-align:center;padding:3px 4px 8px;border-bottom:1.5px solid var(--bd);white-space:nowrap;font-weight:700}
.type-tbl th:first-child{text-align:left;min-width:88px}
.type-tbl td{padding:2px 3px;text-align:center;border-bottom:1px solid var(--bg)}
.type-tbl tr:last-child td{border-bottom:none}
.type-tbl tr:hover td{background:var(--bg)}
.ec2{width:44px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mf);font-size:10px;font-weight:700;margin:0 auto;border:1.5px solid transparent}
.e4{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.e2{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
.e1{background:transparent;color:var(--t3)}
.e05{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.e025{background:#dcfce7;color:#15803d;border-color:#86efac}
.e0{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.cnt{font-family:var(--mf);font-size:11px;font-weight:700;padding:0 6px}
.cnt-w{color:#dc2626}.cnt-r{color:#16a34a}.cnt-i{color:#2563eb}.cnt-z{color:var(--t3)}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--t2);font-weight:600;align-items:center}
.cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-bottom:20px}
.cov-item{padding:7px 6px;border-radius:var(--r1);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid transparent}
.cov-yes{background:#f0fdf4;border-color:#86efac}.cov-no{background:#fef2f2;border-color:#fecaca}
.cov-cnt{font-family:var(--mf);font-size:10px;font-weight:700}.cov-cnt.yes{color:#15803d}.cov-cnt.no{color:#dc2626}
.poke-cov{background:var(--bg);border-radius:var(--r2);padding:12px;margin-bottom:8px}
.pc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pc-spr{width:36px;height:36px;image-rendering:pixelated;object-fit:contain}
.pc-nm{font-weight:900;font-size:.85rem}
.mv-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;font-size:12px;flex-wrap:wrap}
.mv-nm{font-weight:800;min-width:110px;display:flex;align-items:center;gap:4px}
.mv-se{display:flex;flex-wrap:wrap;gap:3px}
.mv-none{color:var(--t3);font-style:italic;font-size:11px}
.no-db{background:#fffbeb;border:1.5px solid #fde68a;border-radius:var(--r1);padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px;font-weight:600}
.dark .no-db{background:#2a1a05;border-color:#8c6a1a;color:#fcd34d}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.mb{background:var(--card);border-radius:var(--r3);width:100%;max-width:530px;max-height:90vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mb.wide{max-width:700px}
.m-ttl{font-size:1rem;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.m-close{position:absolute;top:14px;right:14px;background:var(--bg);border:none;color:var(--t2);cursor:pointer;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.m-close:hover{background:var(--bd2);color:var(--text)}
.m-act{display:flex;gap:7px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1.5px solid var(--bd)}
.sbox{position:relative}
.sugg{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1.5px solid var(--bd);border-top:none;border-radius:0 0 var(--r1) var(--r1);max-height:190px;overflow-y:auto;z-index:20;box-shadow:var(--sh2)}
.sug{padding:8px 12px;cursor:pointer;font-size:13px;font-weight:700;transition:background .1s}
.sug:hover{background:var(--bg)}
.pprev{display:flex;align-items:center;gap:9px;background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--r1);padding:8px 11px;margin-top:5px}
.pprev img{width:80px;height:80px;object-fit:contain;image-rendering:pixelated;border-radius:6px}
.pprev-nm{font-weight:900;font-size:.83rem}
.pprev-t{display:flex;gap:3px;margin-top:3px}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gym-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.gslot{background:var(--bg);border-radius:var(--r1);padding:10px}
.gslot-prev{display:flex;flex-direction:column;align-items:center;min-height:52px;margin-bottom:7px;gap:2px}
.gslot-spr{width:50px;height:50px;object-fit:contain;image-rendering:pixelated}
.gslot-nm{font-size:9px;font-weight:800;color:var(--t2);text-align:center}
.warn-box{background:#fffbeb;border:1.5px solid #fde68a;border-radius:var(--r1);padding:8px 12px;font-size:12px;color:#92400e;margin-bottom:12px;font-weight:600}
.dark .warn-box{background:#2a1a05;border-color:#8c6a1a;color:#fcd34d}


/* ═══ MOBILE ═══ */
@media (max-width: 768px) {
  .home{padding:20px 16px}
  .home-hdr{flex-direction:column;align-items:stretch;margin-bottom:28px}
  .home-logo{font-size:1.8rem}
  .runs-grid{grid-template-columns:1fr}
  .nav{padding:0 8px;height:52px;gap:0}
  .nav-logo{font-size:.9rem;margin-right:6px;flex-shrink:0}
  .nav-tab{padding:0 8px;font-size:10px;gap:3px;height:52px;flex-shrink:0}
  .nav-tab svg{width:11px;height:11px}
  .nav-r{gap:4px;flex-shrink:0}
  .run-chip{display:none}
  .stabs{padding:10px 16px 0;overflow-x:auto}
  .content{padding:14px 16px}
  .sh{gap:6px}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .pc{padding:12px 10px}
  .psprite,.psprite-ph{width:64px;height:64px}
  .ggrid{grid-template-columns:repeat(2,1fr);gap:8px}
  .gc{padding:10px}
  .rrow{flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px}
  .rname{min-width:auto;width:100%}
  .rbtns{flex-wrap:wrap;width:100%}
  .rpoke{width:100%;padding-top:4px;border-top:1px solid var(--bg)}
  .gymgrid{grid-template-columns:1fr}
  .gym-slots{grid-template-columns:1fr 1fr}
  .type-tbl{font-size:10px}
  .type-tbl th:first-child{min-width:60px}
  .ec2{width:32px;height:22px;font-size:9px}
  .cov-grid{grid-template-columns:repeat(3,1fr)}
  .mvgrid{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr}
  .mb{padding:18px 16px}
  .mb.wide{max-width:100%}
  .pprev{flex-direction:column;align-items:flex-start;gap:6px}
  .pprev img{width:64px;height:64px}
  .setup-card{padding:24px 20px}
  .leg{gap:6px;font-size:10px}
  .an-ttl{font-size:.65rem}
}
@media (max-width: 480px) {
  .pgrid{grid-template-columns:1fr}
  .gym-slots{grid-template-columns:1fr}
  .cov-grid{grid-template-columns:repeat(2,1fr)}
}

/* SETUP */
.setup-card{background:var(--card);padding:32px;border-radius:var(--r3);box-shadow:var(--sh2);max-width:480px;width:100%;text-align:center}
.setup-row{text-align:left;display:flex;flex-direction:column;gap:16px;margin-bottom:24px}

.nav button{flex:0 0 auto}

/* ══ NAV LIGHT THEME ══ */
body:not(.dark) .nav{background:#FF0000}
body:not(.dark) .nav-logo{color:#f2f2f7}
body:not(.dark) .nav-tab{color:rgba(255,255,255,.75)}
body:not(.dark) .nav-tab:hover{color:#f2f2f7;background:rgba(255,255,255,.15)}
body:not(.dark) .nav-r .btn-i{color#f2f2f7}
body:not(.dark) .run-chip{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#f2f2f7}
body:not(.dark) .nav-r .btn-o{border-color:rgba(255,255,255,.55);color:#f2f2f7}
body:not(.dark) .nav-r .btn-o:hover{background:rgba(255,255,255,.2)}

/* ══ ANALYSIS DEFENSE CARDS ══ */
.def-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:4px}
.def-card{background:var(--bg);border-radius:var(--r2);padding:12px;border:1.5px solid var(--bd)}
.def-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.def-thumb{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.def-pname{font-weight:900;font-size:.85rem;line-height:1.2}
.def-types{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.def-row{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.def-mult{display:inline-flex;align-items:center;justify-content:center;width:28px;height:18px;border-radius:4px;font-size:10px;font-weight:900;flex-shrink:0;font-family:var(--mf)}
.def-mult.x4{background:#7f1d1d;color:#fca5a5}
.def-mult.x2{background:#dc2626;color:#fff}
.def-mult.x0{background:#1e40af;color:#bfdbfe}
.def-mult.x05{background:#166534;color:#86efac}
.def-mult.x025{background:#14532d;color:#4ade80}
.def-none{font-size:11px;color:var(--t3);font-style:italic}

/* Team weakness summary row */
.def-summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.def-sum-item{display:flex;align-items:center;gap:3px;padding:3px 6px;border-radius:6px;font-size:10px;font-weight:800}
.def-sum-item.danger{background:#fee2e2;color:#991b1b}
.dark .def-sum-item.danger{background:#450a0a;color:#fca5a5}
.def-sum-item.warning{background:#fef3c7;color:#92400e}
.dark .def-sum-item.warning{background:#2d1a00;color:#fde68a}
.def-sum-item.immune{background:#dbeafe;color:#1e40af}
.dark .def-sum-item.immune{background:#0f172a;color:#93c5fd}

/* ══ BOSS TEAM VIEW MODAL ══ */
.btv-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--bd)}
.btv-badge-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btv-leader-name{font-size:1.1rem;font-weight:900}
.btv-leader-sub{font-size:11px;color:var(--t2);font-weight:600;margin-top:2px}
.btv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.btv-poke{background:var(--bg);border-radius:var(--r2);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--bd)}
.btv-thumb{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.btv-thumb-ph{width:72px;height:72px;background:var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:24px}
.btv-pname{font-weight:900;font-size:.78rem;text-align:center;line-height:1.2}
.btv-lv{font-size:10px;color:var(--t3);font-family:var(--mf);font-weight:700}
.btv-types{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.btv-moves{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:2px}
.btv-mv{font-size:9px;color:var(--t2);font-weight:700;background:var(--card);padding:2px 5px;border-radius:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--bd)}
.rrow.enc-done{border-left:3px solid var(--green);opacity:.75}
.rrow.enc-done .rname{text-decoration:line-through;text-decoration-color:var(--t3);color:var(--t2)}

/* Route Filters */
.route-filters{background:var(--card);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-label{font-size:10px;font-weight:900;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;min-width:40px}
.fchip{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;border:1.5px solid var(--bd2);cursor:pointer;transition:all .15s;background:transparent;color:var(--t2);white-space:nowrap;font-family:var(--hf)}
.fchip:hover{border-color:var(--t2);color:var(--text)}
.fchip.on{background:var(--red);color:#fff;border-color:var(--red2)}
.filter-type-sel{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;height:auto;width:auto;flex:1;max-width:180px}

/* Bottone Team Boss */
.boss-team-btn{background:none;border:2px solid var(--bd);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:not-allowed;transition:all 0.2s;padding:0;opacity:.4;flex-shrink:0}
.boss-team-btn.enabled{border-color:var(--red);opacity:1;cursor:pointer}
.boss-team-btn.enabled:hover{background:var(--red);color:#fff}
.boss-team-btn svg{width:22px;height:22px}

/* Team Viewer Modal */
.tv-section{margin-bottom:18px}
.tv-title{font-size:.65rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);border-bottom:1.5px solid var(--bd);padding-bottom:6px;margin-bottom:10px}
.tv-card{background:var(--bg);border-radius:var(--r2);padding:10px 12px;margin-bottom:7px}
.tv-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tv-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tv-name{font-weight:900;font-size:.88rem}
.tv-sub{font-size:10px;color:var(--t2);font-weight:600}
.tv-team{display:flex;flex-wrap:wrap;gap:5px}
.tv-poke{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:42px}
.tv-poke img{width:42px;height:42px;image-rendering:pixelated;object-fit:contain}
.tv-poke-n{font-size:8px;color:var(--t2);font-weight:800;text-align:center;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-poke-l{font-size:8px;color:var(--t3);font-family:var(--mf)}
.tv-empty{font-size:11px;color:var(--t3);font-style:italic}

/* Bottoni Import/Export */
.system-actions{display:flex;gap:10px;margin-top:20px;padding-top:15px;border-top:2px dashed var(--bd)}

/* ═══ DATA LOADING ═══ */
function rebuildTypeChart(){
  if(!S.typesDB||!S.typesDB.length)return;
  TYPES=S.typesDB.map(t=>t.english);
  TYPE_CHART={};
  for(const t of S.typesDB){
    TYPE_CHART[t.english]={};
    for(const e of(t.effective||[]))TYPE_CHART[t.english][e]=2;
    for(const i of(t.ineffective||[]))TYPE_CHART[t.english][i]=.5;
    for(const n of(t.no_effect||[]))TYPE_CHART[t.english][n]=0;
  }
}
function parseMovesDB(raw){
  S.movesDB={};
  for(const move of raw){
    const key=normMvKey(move.name.english);
    const entry={name:move.name.english,type:move.type,cat:move.category.toLowerCase(),pow:parseInt(move.power)||0,acc:parseInt((move.accuracy||'').replace('%',''))||0,pp:parseInt(move.pp)||0};
    S.movesDB[key]=entry;
    const k2=key.replace(/-/g,'');if(k2!==key)S.movesDB[k2]=entry;
  }
}
function checkSetup(){
  const p=loadDB('pokedex'),t=loadDB('types'),m=loadDB('moves');
  if(p){S.pokedexDB=p;S.setupStatus=S.setupStatus||{};S.setupStatus.pokedex=true}
  if(t){S.typesDB=t;rebuildTypeChart();S.setupStatus=S.setupStatus||{};S.setupStatus.types=true}
  if(m){parseMovesDB(m);S.setupStatus=S.setupStatus||{};S.setupStatus.moves=true}
  if(!(p&&t&&m)){S.view='setup';S.setupStatus={pokedex:!!p,types:!!t,moves:!!m}}
}

/* ═══ POKEMON SEARCH ═══ */
function searchPokemon(q){
  if(!q||q.length<2||!S.pokedexDB.length)return[];
  const lq=q.toLowerCase();
  return S.pokedexDB
    .filter(p=>p.id<=493&&p.name.english.toLowerCase().includes(lq))
    .sort((a,b)=>(a.name.english.toLowerCase().startsWith(lq)?0:1)-(b.name.english.toLowerCase().startsWith(lq)?0:1)||a.id-b.id)
    .slice(0,8);
}
function pokeFromName(n){return S.pokedexDB.find(p=>p.name.english===n)||null}

}

/* ═══ MOVE SEARCH ═══ */
function searchMoves(q){

    .filter(m=>m.name.toLowerCase().includes(lq))

}

function cap(s){if(!s)return'';return s.charAt(0).toUpperCase()+s.slice(1)}

function tb(type,sm){const c=TC[type]||'#999';return`<span class="tb" style="background:${c}${sm?';padding:1px 6px;font-size:9px':''}">${type}</span>`}
function eu(s){return encodeURIComponent(s)}
function du(s){try{return decodeURIComponent(s)}catch(e){return s}}
function normMvKey(n){return n.toLowerCase().trim().replace(/[''`]/g,'').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}
function getMoveTypeColor(moveName){
  if(!moveName||!Object.keys(S.movesDB).length)return null;
  const key=normMvKey(moveName);
  const move=S.movesDB[key];
  return move?(TC[move.type]||null):null;
}
function statsBarSVG(stats,compact){
  if(!stats)return'';
  const SK=[{k:'HP',l:'HP'},{k:'Attack',l:'Atk'},{k:'Defense',l:'Def'},{k:'Sp. Attack',l:'SpA'},{k:'Sp. Defense',l:'SpD'},{k:'Speed',l:'Spe'}];
  const vals=SK.map(s=>({...s,v:stats[s.k]||0}));
  const sorted=[...vals].sort((a,b)=>b.v-a.v);
  const cm={};sorted.forEach((s,i)=>{cm[s.k]=i<2?'#ef4444':i<4?'#d97706':null;});
  const MAX=255;
  const bh=compact?'5px':'7px';
  const fs=compact?'9px':'11px';
  const lw=compact?'24px':'30px';
  const vw=compact?'20px':'24px';
  const mb=compact?'2px':'3px';
  const rows=vals.map(s=>{
    const pct=Math.max((s.v/MAX)*100,1).toFixed(1);
    const c=cm[s.k];
    const fill=c?`background:${c}`:`background:#fff;outline:1px solid var(--bd2)`;
    return`<div style="display:flex;align-items:center;gap:5px;margin-bottom:${mb}">
<span style="font-size:${fs};font-family:var(--mf);color:var(--t2);width:${lw};flex-shrink:0;text-align:right;font-weight:600">${s.l}</span>
<div style="flex:1;height:${bh};background:var(--bd);border-radius:3px;overflow:hidden">
<div style="width:${pct}%;height:100%;border-radius:3px;${fill}"></div>
</div>
<span style="font-size:${fs};font-family:var(--mf);color:var(--t1);width:${vw};flex-shrink:0;font-weight:600">${s.v}</span>
</div>`;
  }).join('');
  return`<div style="padding:2px 0">${rows}</div>`;
}
function getGymCap(gymDef,gymRun){
  const team=gymRun?.team||[];
  if(team.length){const mx=Math.max(...team.map(p=>parseInt(p.level)||0));if(mx>0)return{cap:mx,dyn:true}}
  return{cap:gymDef.levelCap,dyn:false};
}

/* ═══ TYPE ANALYSIS ═══ */
function defMult(atk,dts){const ch=TYPE_CHART[atk]||{};return dts.reduce((m,dt)=>m*(ch[dt]!==undefined?ch[dt]:1),1)}
function mClass(m){if(m===0)return'e0';if(m<=.25)return'e025';if(m<1)return'e05';if(m===1)return'e1';if(m<4)return'e2';return'e4'}
function mLabel(m){if(m===0)return'✕';if(m<=.25)return'¼';if(m<1)return'½';if(m===1)return'—';if(m<4)return'×2';return'×4'}
function getSETargets(t){const ch=TYPE_CHART[t]||{};return TYPES.filter(dt=>(ch[dt]||1)>1)}
function getMoveCoverage(poke){
  return(poke.moves||[]).filter(Boolean).map(mv=>{
    const key=normMvKey(mv);const move=S.movesDB[key];
    if(!move)return{mv,type:null,se:[],found:false};
    const se=(move.cat==='status'||move.pow<=0)?[]:getSETargets(move.type);
    return{mv,type:move.type,se,found:true};
  });
}
function getTeamCoverage(party){
  const cov={};TYPES.forEach(t=>cov[t]=new Set());
  party.forEach(p=>{
    const seen=new Set();
    getMoveCoverage(p).forEach(({se})=>se.forEach(t=>{if(!seen.has(t)){cov[t].add(p.id);seen.add(t)}}));
  });
  return cov;
}

          <span style="font-size:12px;font-weight:700;color:${st.moves?'var(--green)':'var(--red)'}">${st.moves?'✓ Caricato':'❌ Manca'}</span>
        </div>
      </div>
    </div>
    <button class="btn btn-r" style="width:100%;justify-content:center" data-a="finish-setup" ${ready?'':'disabled'}>Avvia App</button>

</div>`;
}

  const r=run();if(!r)return renderHome();

/* ROUTES */
function renderRoutes(r,g){
  if(!g)return'';
  const done=g.areas.filter(a=>r.encounters[a]?.status).length;
  const ENC=[{id:'caught',l:'Catturato',c:'ec'},{id:'defeated',l:'Sconfitto',c:'ed'},{id:'traded',l:'Scambiato',c:'et'},{id:'gifted',l:'Regalato',c:'eg'},{id:'missed',l:'Mancato',c:'em'}];
  const POS=['caught','traded','gifted'];
  const rf=S.rFilters;
  const STATUS_CHIPS=[{id:'',l:'Tutti'},{id:'caught',l:'Catturato'},{id:'defeated',l:'Sconfitto'},{id:'traded',l:'Scambiato'},{id:'gifted',l:'Regalato'},{id:'missed',l:'Mancato'},{id:'__none',l:'Non incontrato'}];
  const filteredAreas=g.areas.filter(area=>{
    const enc=r.encounters[area]||{};
    const st=enc.status||null;
    if(rf.status){
      if(rf.status==='__none'){if(st!==null)return false;}
      else{if(st!==rf.status)return false;}
    }
    if(rf.type){
      const lp=enc.pokeId?(r.pokemon||[]).find(p=>p.id===enc.pokeId):null;
      if(!lp)return false;
      if(!(lp.types||[]).includes(rf.type))return false;
    }
    return true;
  });
  const filtersHTML=`<div class="route-filters">
    <div class="filter-row">
      <span class="filter-label">Stato</span>
      ${STATUS_CHIPS.map(c=>`<button class="fchip${rf.status===c.id?' on':''}" data-a="rf-status" data-v="${c.id}">${c.l}</button>`).join('')}
    </div>
    <div class="filter-row">
      <span class="filter-label">Tipo</span>
      <select class="filter-type-sel" data-a="rf-type">
        <option value="">Tutti i tipi</option>
        ${TYPES.map(t=>`<option value="${t}" ${rf.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      ${rf.status||rf.type?`<button class="fchip" data-a="rf-reset" style="margin-left:4px">✕ Reset</button>`:''}
    </div>
  </div>`;
  return`<div>
  <div class="sh">
    <span class="sh-t">Aree & Incontri</span><span class="sh-c">${done}/${g.areas.length}</span>
    <button class="btn btn-o btn-sm" data-a="add-poke" data-st="party" style="margin-left:auto">${I.plus} Aggiungi Pkm manuale</button>
  </div>
  ${filtersHTML}
  ${filteredAreas.length===0?`<div class="empty" style="padding:40px 20px"><h2 style="font-size:1rem">Nessuna area trovata</h2><p>Prova a cambiare i filtri.</p></div>`:''}
  <div class="rl">${filteredAreas.map(area=>{
    const enc=r.encounters[area]||{};
    const st=enc.status||null;
    const lp=enc.pokeId?(r.pokemon||[]).find(p=>p.id===enc.pokeId):null;
    const isPos=POS.includes(st);
    const isDone=st!==null;
    return`<div class="rrow${isDone?' enc-done':''}">
      <div class="rname">${area}</div>
      <div class="rbtns">${ENC.map(e=>`<button class="eb ${e.c}${st===e.id?' on':''}" data-a="set-enc" data-area="${eu(area)}" data-st="${e.id}">${e.l}</button>`).join('')}</div>
      ${lp?`<div class="rpoke${lp.status==='dead'?' dead':''}">
        ${lp.sprite?`<img src="${lp.sprite}" alt="">`:''}
        <span>${lp.nickname||lp.speciesName}</span>
        <span style="color:var(--t3);font-family:var(--mf);font-size:10px">${lp.level?`Lv.${lp.level}`:''}</span>
        ${lp.status==='dead'?`<span style="color:var(--red);font-size:10px">${I.skull}</span>`:''}
      </div>`:isPos?`<button class="btn-g btn-sm" data-a="add-enc-poke" data-area="${eu(area)}">${I.plus} Pokémon</button>`:``}
    </div>`;
  }).join('')}</div>
</div>`;
}

/* SQUAD */
function renderSquad(r,g){
  if(S.stab==='grave')return renderGrave(r);
  if(S.stab==='analysis')return renderAnalysis(r);
  if(S.stab==='box')return renderBoxOnly(r,g);
  return renderPartyOnly(r,g);
}
function renderPartyOnly(r,g){
  const party=(r.pokemon||[]).filter(p=>p.status==='party');
  return`<div>
  <div class="sh"><span class="sh-t">Squadra</span><span class="sh-c">${party.length}/6</span>
    <button class="btn btn-r btn-sm" data-a="add-poke" data-st="party" style="margin-left:auto">${I.plus} Aggiungi</button>
  </div>
  <div class="pgrid">${party.map(p=>pokeCard(p,g)).join('')}${!party.length?`<p style="padding:20px;color:var(--t3);font-size:13px">Nessun Pokémon in squadra.</p>`:''}</div>
</div>`;
}
function renderBoxOnly(r,g){
  const box=(r.pokemon||[]).filter(p=>p.status==='box');
  return`<div>
  <div class="sh"><span class="sh-t">Box</span><span class="sh-c">${box.length}</span>
    <button class="btn-g btn-sm" data-a="add-poke" data-st="box" style="margin-left:auto">${I.plus} Box</button>
  </div>
  <div class="pgrid">${box.map(p=>pokeCard(p,g)).join('')}${!box.length?`<p style="padding:20px;color:var(--t3);font-size:13px">Nessun Pokémon nel Box.</p>`:''}</div>
</div>`;
}
function pokeCard(p,g){
  const gen=g?g.gen:3;const moves=(p.moves||[]).filter(Boolean);const ne=NE[p.nature];
  return`<div class="pc${p.status==='dead'?' dead':''}">
  ${p.sprite?`<img class="psprite" src="${p.sprite}">`:`<div class="psprite-ph">${I.party}</div>`}
  <div class="pname">${p.nickname||p.speciesName}</div>
  ${p.nickname?`<div class="pspec">${p.speciesName}</div>`:''}
  <div class="ptyp">${(p.types||[]).map(t=>tb(t)).join('')}</div>
  <div class="prow">Lv.${p.level}${gen>=3&&p.nature?` · ${p.nature}${ne?` (+${ne.u}/-${ne.d})`:''}`:''}</div>
  ${gen>=3&&p.ability?`<div class="prow">${p.ability}</div>`:''}
  ${moves.length?`<div class="pmovs">${moves.map(m=>{const c=getMoveTypeColor(m);return`<span class="pmv" style="${c?`background:${c};color:#fff;border-color:${c}`:''}">${m}</span>`;}).join('')}</div>`:''}
  ${p.stats?`<div style="margin:6px 0 2px;padding:0 2px">${statsBarSVG(p.stats,true)}</div>`:''}
  <div class="par">${I.map} ${p.area||'—'}</div>
  <div class="pac">
    <button class="btn-g btn-sm" data-a="edit-poke" data-pid="${p.id}">${I.edit} Edit</button>
    ${p.status==='party'?`<button class="btn-g btn-sm" data-a="poke-box" data-pid="${p.id}">${I.box}</button>`:
    `<button class="btn-g btn-sm" data-a="poke-party" data-pid="${p.id}">${I.party}</button>`}
    <button class="btn btn-d btn-sm" data-a="poke-ko" data-pid="${p.id}">${I.skull}</button>
  </div>
</div>`;
}

/* GRAVEYARD */
function renderGrave(r){
  const dead=(r.pokemon||[]).filter(p=>p.status==='dead');
  if(!dead.length)return`<div class="empty"><h2>Nessun caduto</h2><p>Ottimo lavoro, continua così.</p></div>`;
  return`<div>
  <div class="sh"><span class="sh-t">Caduti in battaglia</span><span class="sh-c">${dead.length}</span></div>
  <div class="ggrid">${dead.map(p=>`<div class="gc">
    ${p.sprite?`<img class="gsprite" src="${p.sprite}">`:`<div style="height:66px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fca5a5">${I.skull}</div>`}
    <div class="gname">${p.nickname||p.speciesName}</div>
    <div class="gspec">${p.speciesName}</div>
    <div class="ptyp" style="justify-content:center;margin-bottom:4px">${(p.types||[]).map(t=>tb(t,true)).join('')}</div>
    <div class="ginfo">Lv.${p.level}</div>
    <div class="ginfo">${I.map} ${p.area||'—'}</div>
    ${p.deathArea?`<div class="ginfo">${I.skull} ${p.deathArea}</div>`:''}
    <div style="margin-top:8px"><button class="btn-g btn-sm" data-a="edit-poke" data-pid="${p.id}">${I.edit}</button></div>
  </div>`).join('')}</div>
</div>`;
}

/* ANALYSIS */
function renderAnalysis(r){
  const party=(r.pokemon||[]).filter(p=>p.status==='party'&&p.types&&p.types.length>0);
  if(!party.length)return`<div class="empty"><h2>Squadra vuota</h2><p>Aggiungi Pokémon alla squadra per l'analisi.</p></div>`;
  const hasDB=Object.keys(S.movesDB).length>0;
  const teamCov=hasDB?getTeamCoverage(party):{};

  // Defense cards — per pokemon
  const defCards=party.map(p=>{
    const x4=TYPES.filter(t=>defMult(t,p.types)>=4);
    const x2=TYPES.filter(t=>defMult(t,p.types)===2);
    const x0=TYPES.filter(t=>defMult(t,p.types)===0);
    const x05=TYPES.filter(t=>defMult(t,p.types)===0.5);
    const x025=TYPES.filter(t=>defMult(t,p.types)===0.25);
    const allNeutral=!x4.length&&!x2.length&&!x0.length&&!x05.length&&!x025.length;
    return`<div class="def-card">
      <div class="def-card-hdr">
        ${p.thumbnail?`<img class="def-thumb" src="${p.thumbnail}" alt="">`:`<div class="def-thumb" style="background:var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:20px">?</div>`}
        <div><div class="def-pname">${p.nickname||p.speciesName}</div><div class="def-types">${(p.types||[]).map(t=>tb(t,true)).join('')}</div></div>
      </div>
      ${allNeutral?`<div class="def-none">Nessuna debolezza o resistenza</div>`:''}
      ${x4.length?`<div class="def-row"><span class="def-mult x4">×4</span>${x4.map(t=>tb(t,true)).join('')}</div>`:''}
      ${x2.length?`<div class="def-row"><span class="def-mult x2">×2</span>${x2.map(t=>tb(t,true)).join('')}</div>`:''}
      ${x0.length?`<div class="def-row"><span class="def-mult x0">✕</span>${x0.map(t=>tb(t,true)).join('')}</div>`:''}
      ${x05.length?`<div class="def-row"><span class="def-mult x05">½</span>${x05.map(t=>tb(t,true)).join('')}</div>`:''}
      ${x025.length?`<div class="def-row"><span class="def-mult x025">¼</span>${x025.map(t=>tb(t,true)).join('')}</div>`:''}
    </div>`;
  }).join('');

  // Team-level summary: types that hit ≥2 pokemon for ×2 or more
  const teamWeak=TYPES.filter(t=>{
    const cnt=party.filter(p=>defMult(t,p.types)>=2).length;
    return cnt>=2;
  });
  const teamX4=TYPES.filter(t=>party.some(p=>defMult(t,p.types)>=4));
  const teamImm=TYPES.filter(t=>party.every(p=>defMult(t,p.types)===0));
  const summaryHTML=(teamX4.length||teamWeak.length||teamImm.length)?`<div class="def-summary">
    ${teamX4.map(t=>`<div class="def-sum-item danger">×4 ${tb(t,true)}</div>`).join('')}
    ${teamWeak.filter(t=>!teamX4.includes(t)).map(t=>`<div class="def-sum-item warning">×2+ ${tb(t,true)} (${party.filter(p=>defMult(t,p.types)>=2).length} pkm)</div>`).join('')}
    ${teamImm.map(t=>`<div class="def-sum-item immune">✕ ${tb(t,true)} (tutti)</div>`).join('')}
  </div>`:
  `<p class="def-none" style="margin-bottom:10px">Nessuna debolezza comune al team.</p>`;

  const legend=`<div class="leg">
    <div style="display:flex;align-items:center;gap:4px"><span class="def-mult x4">×4</span>Doppia deb.</div>
    <div style="display:flex;align-items:center;gap:4px"><span class="def-mult x2">×2</span>Deb.</div>
    <div style="display:flex;align-items:center;gap:4px"><span class="def-mult x0">✕</span>Immune</div>
    <div style="display:flex;align-items:center;gap:4px"><span class="def-mult x05">½</span>Res.</div>
    <div style="display:flex;align-items:center;gap:4px"><span class="def-mult x025">¼</span>2× Res.</div>
  </div>`;

  const covSec=!hasDB
    ?`<div class="no-db">⚠ moves.json non caricato.</div>`
    :`<div>
    <p style="font-size:12px;color:var(--t2);margin-bottom:14px">Tipi che il team riesce a colpire SE. <span style="color:#15803d;font-weight:800">Verde</span> = coperto, <span style="color:#dc2626;font-weight:800">Rosso</span> = scoperto.</p>
    <div class="cov-grid">${TYPES.map(t=>{
      const cnt=teamCov[t]?teamCov[t].size:0;
      return`<div class="cov-item ${cnt>0?'cov-yes':'cov-no'}">
        ${tb(t,true)}<div class="cov-cnt ${cnt>0?'yes':'no'}">${cnt>0?`${cnt} pkm`:'—'}</div>
      </div>`;
    }).join('')}</div>
    <h4 style="font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin:16px 0 10px">Copertura per Pokémon</h4>
    ${party.map(p=>{
      const covs=getMoveCoverage(p).filter(c=>c.mv.trim());
      return`<div class="poke-cov">
        <div class="pc-hdr">
          ${p.sprite?`<img class="pc-spr" src="${p.sprite}">`:''}
          <div><div class="pc-nm">${p.nickname||p.speciesName}</div>
          <div style="display:flex;gap:3px;margin-top:2px">${(p.types||[]).map(t=>tb(t,true)).join('')}</div></div>
        </div>
        ${!covs.length?`<p class="mv-none">Nessuna mossa inserita</p>`:covs.map(c=>
        `<div class="mv-row">
          <div class="mv-nm">${c.type?tb(c.type,true):''} <span>${c.mv}</span></div>
          ${!c.found?`<span class="mv-none">non in DB</span>`:c.se.length===0?`<span class="mv-none">nessuna SE</span>`:`<div class="mv-se">${c.se.map(t=>tb(t,true)).join('')}</div>`}
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;

  return`<div>
  <div class="an-sec">
    <div class="an-ttl">${I.chart} Difesa — debolezze e resistenze per Pokémon</div>
    <p style="font-size:11px;color:var(--t2);margin-bottom:10px">Vulnerabilità comuni al team:</p>
    ${summaryHTML}
    <div class="def-cards">${defCards}</div>
    ${legend}
  </div>
  <div class="an-sec">
    <div class="an-ttl">${I.chart} Copertura offensiva — super efficacia delle mosse</div>
    ${covSec}
  </div>
</div>`;
}

/* GYMS */
function renderGyms(r,g){
  if(!g)return'';
  const earned=(r.gyms||[]).filter(x=>x.earned).length;
  const gymCard=(gym,i,isE4)=>{
    const rg=isE4?(r.e4teams||[])[i]||{team:[]}:(r.gyms||[])[i]||{earned:false,team:[]};
    const {cap,dyn}=isE4?{cap:null,dyn:false}:getGymCap(gym,rg);
    const c=TC[gym.type||gym.type]||'#888';
    const name=isE4?gym.name:gym.leader;
    const city=isE4?'Elite Four / Campione':gym.city;
    const hasTeam=rg.team&&rg.team.length>0;
    return`<div class="gymc${!isE4&&rg.earned?' earned':''}">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <div style="width:30px;height:30px;border-radius:50%;background:${c}22;border:1.5px solid ${c}55;display:flex;align-items:center;justify-content:center;flex-shrink:0">${I.badge}</div>
        <div><div class="gym-ln">${name}</div><div class="gym-ct">${city}</div></div>
        <button class="boss-team-btn${hasTeam?' enabled':''}" ${hasTeam?'':'disabled'} data-a="view-boss-team" data-gi="${i}" data-e4="${isE4?1:0}" title="Visualizza team" style="margin-left:auto">${I.pokeball}</button>
      </div>
      <div class="gym-info">
        ${(gym.type&&gym.type!=='Mixed')?tb(gym.type,true):`<span style="font-size:11px;color:var(--t2);font-weight:700">Mixed</span>`}
        ${!isE4?`<span class="gym-cap${dyn?' dyn':''}" title="${dyn?'Calcolato dal team':'Default gioco'}">Cap Lv.${cap}${dyn?' ★':''}</span>`:``}
        ${!isE4?`<span style="font-size:9px;color:var(--t3);font-weight:700">${gym.badge}</span>`:''}
      </div>
      ${!isE4?`<button class="badge-btn${rg.earned?' on':''}" data-a="toggle-badge" data-gi="${i}">${rg.earned?I.check+' Badge ottenuto':I.badge+' Segna badge'}</button>`:''}
      <div class="gym-team">${rg.team&&rg.team.length?rg.team.map(s=>`<div class="gpoke">
        ${s.sprite?`<img src="${s.sprite}">`:`<div style="width:42px;height:42px;background:var(--bg);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3)">?</div>`}
        <div class="gpoke-n">${s.displayName}</div>
        ${s.level?`<div class="gpoke-l">Lv.${s.level}</div>`:''}
        ${s.moves?.filter(Boolean).length?`<div style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px">${s.moves.filter(Boolean).map(m=>`<span class="pmv">${m}</span>`).join('')}</div>`:''}
      </div>`).join(''):`<div class="no-team">Nessun team impostato</div>`}</div>
      <button class="btn-g btn-sm" style="margin-top:4px" data-a="edit-gym" data-gi="${i}" data-e4="${isE4?1:0}">${I.edit} Modifica team</button>
    </div>`;
  };
  return`<div>
  <div class="sh"><span class="sh-t">Palestre</span><span class="sh-c">${earned}/${g.gyms.length} badge</span></div>
  <div class="gymgrid">${g.gyms.map((gym,i)=>gymCard(gym,i,false)).join('')}</div>
  <hr class="dv">
  <div class="sh"><span class="sh-t">Elite Four & Campione</span></div>
  <div class="gymgrid">${g.e4.map((e4,i)=>gymCard(e4,i,true)).join('')}</div>
</div>`;
}

/* ═══ MODALS ═══ */
function renderModal(){
  if(!S.modal)return'';
  let c='';
  const t=S.modal.type;
  if(t==='new-run')c=renderNewRunModal();
  else if(t==='add-poke'||t==='edit-poke')c=renderPokeModal(t==='edit-poke');
  else if(t==='edit-gym')c=renderGymModal();
  else if(t==='confirm-ko')c=renderKoModal();
  else if(t==='game-manager')c=renderGameManager();
  else if(t==='game-editor')c=renderGameEditor();
  else if(t==='team-viewer')c=renderTeamViewer();
  else if(t==='boss-team-view')c=renderBossTeamView();
  return`<div class="mo" data-a="close-modal-bg">${c}</div>`;
}

function renderNewRunModal(){
  const ms=S.ms;
  const games=getGames();
  const grps={};
  Object.entries(games).forEach(([k,g])=>{if(!grps[g.gen])grps[g.gen]=[];grps[g.gen].push(k)});
  const sortedGens=Object.keys(grps).sort((a,b)=>a-b);
  return`<div class="mb">
  <button class="m-close" data-a="close-modal">${I.x}</button>
  <div class="m-ttl">${I.plus} Nuova Run</div>
  <div class="fg"><label>Nome run</label><input id="nr-name" placeholder="Es. Nuzlocke Platino…" value="${ms.name||''}"></div>
  <div class="fg"><label>Gioco</label><select id="nr-game">
    <option value="">-- Seleziona gioco --</option>
    ${sortedGens.map(gen=>`<optgroup label="Generazione ${gen}">${grps[gen].map(k=>`<option value="${k}" ${ms.game===k?'selected':''}>${games[k].name}</option>`).join('')}</optgroup>`).join('')}
  </select></div>
  <div class="m-act">
    <button class="btn btn-o" data-a="close-modal">Annulla</button>
    <button class="btn btn-r" data-a="create-run">Crea Run</button>
  </div>
</div>`;
}

function renderPokeModal(isEdit){

  return`<div class="mb">
  <button class="m-close" data-a="close-modal">${I.x}</button>

  ${noDb||noTypes?`<div class="warn-box">⚠ ${noDb?"pokedex.json":"types.json"} non caricato.</div>`:''}
  <div class="fg"><label>Specie *</label><div class="sbox">
    <input id="poke-search" placeholder="Cerca Pokémon…" value="${ms.speciesQ||''}" autocomplete="off" data-a="poke-search">
    <div id="poke-sugg" class="sugg" style="display:none"></div>
  </div>
  ${sp?`<div class="pprev">${sp.thumbnail?`<img src="${sp.thumbnail}">`:''}
    <div>
      ${sp.dexId?`<div style="font-size:9px;color:var(--t3);font-family:var(--mf)">#${String(sp.dexId).padStart(3,'0')}</div>`:''}
      <div class="pprev-nm">${sp.displayName}</div>
      <div class="pprev-t">${sp.types.map(t=>tb(t,true)).join('')}</div>
      ${sp.stats?`<div style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:var(--r1);border:1px solid var(--bd)">${statsBarSVG(sp.stats,false)}</div>`:''}
      ${sp.description?`<div style="font-size:10px;color:var(--t2);margin-top:4px;line-height:1.3;max-width:260px">${sp.description.slice(0,110)}…</div>`:''}
    </div>
  </div>`:''}</div>
  <div class="fg"><label>Soprannome</label><input id="poke-nick" placeholder="Soprannome (opzionale)" value="${ms.nickname||''}" ></div>
  <div class="fr">
    <div class="fg"><label>Livello</label><input id="poke-lv" type="number" min="1" max="100" placeholder="Lv. (opzionale)" value="${ms.level||''}" ></div>
    <div class="fg"><label>Stato</label><select id="poke-status">
      <option value="party" ${ms.status==='party'?'selected':''}>Squadra</option>
      <option value="box" ${(ms.status==='box'||(ms.fromEncounter&&!ms.status))?'selected':''}>Box</option>
      ${isEdit?`<option value="dead" ${ms.status==='dead'?'selected':''}>Morto</option>`:''}
    </select></div>
  </div>
  <div class="fg"><label>Area cattura</label><select id="poke-area">
    <option value="">-- Area --</option>
    ${(g?g.areas:[]).map(a=>`<option value="${a}" ${ms.area===a?'selected':''} >${a}</option>`).join('')}
  </select></div>
  ${isEdit&&ms.status==='dead'?`<div class="fg"><label>Area di morte</label><select id="poke-death">
    <option value="">-- Dove è morto? --</option>
    ${(g?g.areas:[]).map(a=>`<option value="${a}" ${ms.deathArea===a?'selected':''} >${a}</option>`).join('')}
  </select></div>`:''}
  ${gen>=3?`<div class="fr">
    <div class="fg"><label>Natura</label><select id="poke-nature"><option value="">—</option>
      ${NATURES.map(n=>{const e=NE[n];return`<option value="${n}" ${ms.nature===n?'selected':''} >${n}${e?` (+${e.u}/-${e.d})`:' (neutro)'}</option>`;}).join('')}
    </select></div>
    <div class="fg"><label>Abilità</label><select id="poke-ability"><option value="">—</option>
      ${abs.map(a=>`<option value="${a}" ${ms.ability===a?'selected':''} >${a}</option>`).join('')}
      ${ms.ability&&!abs.includes(ms.ability)?`<option value="${ms.ability}" selected>${ms.ability}</option>`:''}

  </div>`:''}
  <div class="fg"><label>Mosse (max 4)</label><div class="mvgrid">
    ${[0,1,2,3].map(i=>`
      <div class="sbox">
        <input id="poke-mv${i}" placeholder="Cerca mossa…" value="${(ms.moves||[])[i]||''}" data-a="move-search" data-mi="${i}" autocomplete="off">
        <div id="move-sugg-${i}" class="sugg" style="display:none"></div>
      </div>
    `).join('')}
  </div></div>
  <div class="m-act">
    ${isEdit?`<button class="btn btn-d btn-sm" data-a="del-poke" data-pid="${ms.pokeId}" style="margin-right:auto">${I.trash} Elimina</button>`:''}
    <button class="btn btn-o" data-a="close-modal">Annulla</button>
    <button class="btn btn-r" data-a="${isEdit?'save-poke':'add-poke-confirm'}">${isEdit?I.check+' Salva':I.plus+' Aggiungi'}</button>

function renderGymModal(){
  const ms=S.ms;const g=game();const r=run();
  const gymDef=ms.isE4?(g?g.e4[ms.gymIdx]:null):(g?g.gyms[ms.gymIdx]:null);
  const title=gymDef?(ms.isE4?gymDef.name:gymDef.leader):'Allenatore';
  const slots=ms.slots||Array(6).fill().map(()=>({}));
  const runGym=!ms.isE4?(r?.gyms||[])[ms.gymIdx]:null;
  const {cap,dyn}=!ms.isE4&&gymDef?getGymCap(gymDef,runGym||{}):{cap:null,dyn:false};
  return`<div class="mb wide">
  <button class="m-close" data-a="close-modal">${I.x}</button>
  <div class="m-ttl">${I.badge} Team — ${title}</div>
  ${!ms.isE4&&cap?`<p style="font-size:12px;color:var(--t2);margin-bottom:12px">Cap attuale: <strong style="color:var(--amber)">Lv.${cap}</strong>${dyn?' (dal max livello del team)':' (default gioco)'}</p>`:''}
  <div class="gym-slots">${slots.map((slot,i)=>`<div class="gslot">
    <div class="gslot-prev">
      ${slot.thumbnail||slot.sprite?`<img class="gslot-spr" src="${slot.thumbnail||slot.sprite}">`:`<div style="width:50px;height:50px;background:var(--bd);border-radius:var(--r1);display:flex;align-items:center;justify-content:center;color:var(--t3)">?</div>`}
      ${slot.displayName?`<div class="gslot-nm">${slot.displayName}</div>`:''}
    </div>
    <div class="sbox" style="margin-bottom:6px">
      <input placeholder="Cerca…" value="${slot.search||''}" data-a="gym-slot-search" data-si="${i}" autocomplete="off">
      <div id="gss-${i}" class="sugg" style="${(slot.sugg||[]).length?'':'display:none'}">
        ${(slot.sugg||[]).map(n=>`<div class="sug" data-a="gym-sel-species" data-si="${i}" data-name="${n}">${cap(n)}</div>`).join('')}
      </div>
    </div>
    <input type="number" min="1" max="100" placeholder="Lv." value="${slot.level||''}" data-a="gym-slot-lv" data-si="${i}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px">
      ${[0,1,2,3].map(mi=>`
        <div class="sbox">
          <input placeholder="Mv${mi+1}" value="${slot.moves?.[mi]||''}" style="font-size:11px;padding:4px 6px" data-a="gym-mv-search" data-si="${i}" data-mi="${mi}" autocomplete="off">
          <div id="gym-move-sugg-${i}-${mi}" class="sugg" style="display:none"></div>
        </div>
      `).join('')}
    </div>
    ${slot.displayName?`<button class="btn-g btn-sm" style="margin-top:4px;width:100%;justify-content:center;font-size:10px" data-a="gym-clear-slot" data-si="${i}">${I.x} Rimuovi</button>`:''}
  </div>`).join('')}</div>
  <div class="m-act">
    <button class="btn btn-o" data-a="close-modal">Annulla</button>
    <button class="btn btn-r" data-a="save-gym-team">${I.check} Salva Team</button>
  </div>
</div>`;
}

function renderKoModal(){

  <button class="m-close" data-a="close-modal">${I.x}</button>

  <div class="m-act">
    <button class="btn btn-o" data-a="close-modal">Annulla</button>
    <button class="btn btn-r" data-a="confirm-ko">${I.skull} Conferma</button>
  </div>
</div>`;
}

    <button class="m-close" data-a="close-modal">${I.x}</button>
    <div class="m-ttl">Gestisci Giochi</div>
    <div style="margin-bottom:14px"><button class="btn btn-r btn-sm" data-a="new-game">${I.plus} Nuovo Gioco</button></div>

      ${Object.entries(allGames).map(([k,g])=>`

            <div style="font-weight:900;font-size:.9rem">${g.name}</div>
